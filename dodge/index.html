<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>隕石よけサバイバル</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
    background: #0b0d1a;
    color: #f2f2f5;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; }

  #hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    padding: 12px 20px;
    font-size: 18px;
    font-weight: 600;
    pointer-events: none;
  }
  #hud b { font-variant-numeric: tabular-nums; }
  #shield-ind { color: #4cc9f0; }

  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
    text-align: center;
    background: rgba(11,13,26,.88);
  }
  .overlay h1 { font-size: clamp(28px, 7vw, 48px); }
  .overlay p  { color: #b8b9c6; line-height: 1.7; }
  .overlay .big { font-size: 56px; font-weight: 800; color: #ffd166; }
  .overlay button {
    margin-top: 8px;
    padding: 14px 40px;
    font-size: 20px;
    font-weight: 700;
    color: #0b0d1a;
    background: #4cc9f0;
    border: none;
    border-radius: 999px;
    cursor: pointer;
  }
  .overlay button:hover { filter: brightness(1.1); }
  .new-best { color: #06d6a0; font-weight: 700; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <span>タイム <b id="time">0.0</b> 秒</span>
  <span id="shield-ind"></span>
  <span>ベスト <b id="best">0.0</b></span>
</div>

<div id="start" class="overlay">
  <h1>🌌 隕石よけサバイバル</h1>
  <p>
    降ってくる隕石をよけて、できるだけ長く生き残ろう！<br>
    操作：← → キー（A / D でも可）<br>
    スマホ・マウス：画面をタッチ／クリックしたまま左右に動かす<br>
    🛡️ 青いアイテムを取るとシールドで1回だけ耐えられます。
  </p>
  <button id="start-btn">スタート</button>
</div>

<div id="result" class="overlay" hidden>
  <h1>ゲームオーバー</h1>
  <div class="big"><span id="final">0.0</span> 秒</div>
  <p id="new-best" class="new-best" hidden>🏆 ベスト更新！</p>
  <p>ベスト: <b id="best-result">0.0</b> 秒</p>
  <button id="retry-btn">もう一回（Space）</button>
</div>

<script>
(() => {
  const BEST_KEY = 'meteorDodgeBest';
  const $ = id => document.getElementById(id);
  const canvas = $('game');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0;
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (state) state.player.y = H - 60;
  }
  window.addEventListener('resize', resize);

  // ----- ベストスコア -----
  function loadBest() {
    try { return Number(localStorage.getItem(BEST_KEY)) || 0; } catch { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem(BEST_KEY, String(v)); } catch {}
  }

  // ----- 背景の星 -----
  const stars = Array.from({ length: 120 }, () => ({
    x: Math.random(), y: Math.random(),
    r: Math.random() * 1.5 + 0.3,
    v: Math.random() * 0.03 + 0.01,
  }));

  // ----- 入力 -----
  const keys = { left: false, right: false };
  let pointerX = null;

  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
    if ((e.key === ' ' || e.key === 'Enter') && !(state && state.running)) {
      e.preventDefault();
      startGame();
    }
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
  });
  canvas.addEventListener('pointerdown', e => {
    pointerX = e.clientX;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    if (pointerX !== null) pointerX = e.clientX;
  });
  const releasePointer = () => { pointerX = null; };
  canvas.addEventListener('pointerup', releasePointer);
  canvas.addEventListener('pointercancel', releasePointer);

  // ----- ゲーム状態 -----
  let state = null;
  let lastTime = 0;

  function difficulty(t) {
    const k = Math.min(t / 60, 1);          // 60秒で最高難度
    return {
      spawnInterval: 0.65 - 0.5 * k,        // 0.65s → 0.15s
      speedMin: 180 + 220 * k,
      speedMax: 280 + 320 * k,
      sizeMax: 22 + 14 * k,
    };
  }

  function startGame() {
    keys.left = keys.right = false;
    pointerX = null;
    state = {
      running: true,
      time: 0,
      player: { x: W / 2, y: H - 60, r: 16, speed: 440 },
      meteors: [],
      items: [],
      particles: [],
      spawnTimer: 0,
      itemTimer: 6 + Math.random() * 4,
      shield: false,
      invincible: 0,
    };
    $('start').hidden = true;
    $('result').hidden = true;
    updateShieldHud();
  }

  function makeMeteor(d) {
    const r = 12 + Math.random() * (d.sizeMax - 12);
    const n = 9;
    const shape = Array.from({ length: n }, () => 0.75 + Math.random() * 0.35);
    return {
      x: r + Math.random() * (W - r * 2),
      y: -r,
      r,
      vy: d.speedMin + Math.random() * (d.speedMax - d.speedMin),
      vx: (Math.random() - 0.5) * 60,
      rot: Math.random() * Math.PI * 2,
      spin: (Math.random() - 0.5) * 3,
      shape,
    };
  }

  function burst(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 60 + Math.random() * 240;
      state.particles.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: 0.5 + Math.random() * 0.4, age: 0, color,
      });
    }
  }

  const hitTest = (a, b, shrink) =>
    Math.hypot(a.x - b.x, a.y - b.y) < a.r + b.r * shrink;

  function update(dt) {
    const s = state;
    s.time += dt;
    const d = difficulty(s.time);
    const p = s.player;

    // 自機の移動
    let dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (pointerX !== null && dir === 0) {
      const diff = pointerX - p.x;
      if (Math.abs(diff) > 4) dir = Math.sign(diff) * Math.min(1, Math.abs(diff) / 40);
    }
    p.x = Math.max(p.r, Math.min(W - p.r, p.x + dir * p.speed * dt));
    if (s.invincible > 0) s.invincible -= dt;

    // 隕石の出現
    s.spawnTimer -= dt;
    if (s.spawnTimer <= 0) {
      s.meteors.push(makeMeteor(d));
      s.spawnTimer = d.spawnInterval * (0.6 + Math.random() * 0.8);
    }

    // シールドアイテムの出現
    s.itemTimer -= dt;
    if (s.itemTimer <= 0) {
      s.items.push({ x: 20 + Math.random() * (W - 40), y: -20, r: 14, vy: 150 });
      s.itemTimer = 8 + Math.random() * 6;
    }

    // 隕石の移動と当たり判定（見た目より少し甘めに判定）
    for (let i = s.meteors.length - 1; i >= 0; i--) {
      const m = s.meteors[i];
      m.y += m.vy * dt;
      m.x += m.vx * dt;
      m.rot += m.spin * dt;
      if (m.y - m.r > H || m.x < -m.r * 2 || m.x > W + m.r * 2) {
        s.meteors.splice(i, 1);
        continue;
      }
      if (s.invincible <= 0 && hitTest(p, m, 0.75)) {
        if (s.shield) {
          s.shield = false;
          s.invincible = 1.2;
          s.meteors.splice(i, 1);
          burst(m.x, m.y, '#4cc9f0', 24);
          updateShieldHud();
        } else {
          burst(p.x, p.y, '#ff9f1c', 50);
          gameOver();
          return;
        }
      }
    }

    // アイテム
    for (let i = s.items.length - 1; i >= 0; i--) {
      const it = s.items[i];
      it.y += it.vy * dt;
      if (it.y - it.r > H) { s.items.splice(i, 1); continue; }
      if (hitTest(p, it, 1)) {
        s.items.splice(i, 1);
        s.shield = true;
        burst(it.x, it.y, '#4cc9f0', 16);
        updateShieldHud();
      }
    }

    updateParticles(dt);
    $('time').textContent = s.time.toFixed(1);
  }

  function updateParticles(dt) {
    const ps = state.particles;
    for (let i = ps.length - 1; i >= 0; i--) {
      const q = ps[i];
      q.age += dt;
      if (q.age >= q.life) { ps.splice(i, 1); continue; }
      q.x += q.vx * dt;
      q.y += q.vy * dt;
      q.vx *= 0.96;
      q.vy *= 0.96;
    }
  }

  function updateShieldHud() {
    $('shield-ind').textContent = state && state.shield ? '🛡️ シールド' : '';
  }

  function gameOver() {
    state.running = false;
    const t = Math.floor(state.time * 10) / 10;
    const best = loadBest();
    const isNew = t > best;
    if (isNew) saveBest(t);

    $('final').textContent = t.toFixed(1);
    $('best-result').textContent = Math.max(best, t).toFixed(1);
    $('best').textContent = Math.max(best, t).toFixed(1);
    $('new-best').hidden = !isNew;
    updateShieldHud();
    // 爆発を少し見せてから結果を表示
    setTimeout(() => { $('result').hidden = false; }, 700);
  }

  // ----- 描画 -----
  function draw(dt) {
    ctx.fillStyle = '#0b0d1a';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#ffffff';
    for (const st of stars) {
      st.y += st.v * dt;
      if (st.y > 1) { st.y = 0; st.x = Math.random(); }
      ctx.globalAlpha = 0.3 + st.r / 2;
      ctx.beginPath();
      ctx.arc(st.x * W, st.y * H, st.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (!state) return;
    const s = state;

    for (const it of s.items) {
      ctx.save();
      ctx.shadowColor = '#4cc9f0';
      ctx.shadowBlur = 16;
      ctx.fillStyle = '#4cc9f0';
      ctx.beginPath();
      ctx.arc(it.x, it.y, it.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#0b0d1a';
      ctx.font = 'bold 16px system-ui';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('S', it.x, it.y + 1);
    }

    for (const m of s.meteors) {
      ctx.save();
      ctx.translate(m.x, m.y);
      ctx.rotate(m.rot);
      ctx.fillStyle = '#8d6e63';
      ctx.strokeStyle = '#5d4037';
      ctx.lineWidth = 2;
      ctx.beginPath();
      m.shape.forEach((k, i) => {
        const a = (i / m.shape.length) * Math.PI * 2;
        const x = Math.cos(a) * m.r * k;
        const y = Math.sin(a) * m.r * k;
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#6d4c41';
      ctx.beginPath();
      ctx.arc(m.r * 0.25, -m.r * 0.2, m.r * 0.22, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    if (s.running) drawPlayer(s);

    for (const q of s.particles) {
      ctx.globalAlpha = 1 - q.age / q.life;
      ctx.fillStyle = q.color;
      ctx.fillRect(q.x - 2, q.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
  }

  function drawPlayer(s) {
    const p = s.player;
    // 無敵中は点滅
    if (s.invincible > 0 && Math.floor(s.invincible * 12) % 2 === 0) return;

    // 噴射
    ctx.fillStyle = Math.random() < 0.5 ? '#ff9f1c' : '#ffd166';
    ctx.beginPath();
    ctx.moveTo(p.x - 6, p.y + 14);
    ctx.lineTo(p.x + 6, p.y + 14);
    ctx.lineTo(p.x, p.y + 24 + Math.random() * 8);
    ctx.closePath();
    ctx.fill();

    // 機体
    ctx.fillStyle = '#e0e1ea';
    ctx.beginPath();
    ctx.moveTo(p.x, p.y - 20);
    ctx.lineTo(p.x + 16, p.y + 14);
    ctx.lineTo(p.x, p.y + 8);
    ctx.lineTo(p.x - 16, p.y + 14);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#4cc9f0';
    ctx.beginPath();
    ctx.arc(p.x, p.y - 2, 4, 0, Math.PI * 2);
    ctx.fill();

    if (s.shield) {
      ctx.strokeStyle = 'rgba(76,201,240,.8)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r + 10, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function frame(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.05);   // タブ復帰時の飛びを防ぐ
    lastTime = now;
    if (state && state.running) update(dt);
    else if (state) updateParticles(dt);
    draw(dt);
    requestAnimationFrame(frame);
  }

  resize();
  $('best').textContent = loadBest().toFixed(1);
  $('start-btn').addEventListener('click', startGame);
  $('retry-btn').addEventListener('click', startGame);
  requestAnimationFrame(t => { lastTime = t; frame(t); });
})();
</script>
</body>
</html>
