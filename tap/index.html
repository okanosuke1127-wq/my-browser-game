<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>反射神経タップ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
    background: #12131a;
    color: #f2f2f5;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    overscroll-behavior: none;
  }

  #hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: calc(52px + env(safe-area-inset-top, 0px));
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: env(safe-area-inset-top, 0px) 16px 0;
    font-size: 18px;
    font-weight: 600;
    background: rgba(0,0,0,.35);
    z-index: 10;
  }
  #hud span b { font-variant-numeric: tabular-nums; }
  #combo { color: #ffd166; min-width: 6em; text-align: center; }

  #field {
    position: fixed;
    top: calc(52px + env(safe-area-inset-top, 0px));
    left: 0; right: 0;
    bottom: env(safe-area-inset-bottom, 0px);
    cursor: crosshair;
  }
  @media (max-width: 480px) {
    #hud { font-size: 15px; }
    #combo { min-width: 0; }
  }

  .target {
    position: absolute;
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(1);
    background: radial-gradient(circle,
      #fff 0 18%, #ef476f 19% 38%, #fff 39% 58%, #ef476f 59% 100%);
    box-shadow: 0 0 18px rgba(239,71,111,.6);
    animation: pop-in .12s ease-out;
  }
  .target.gold {
    background: radial-gradient(circle,
      #fff 0 18%, #ffd166 19% 38%, #fff 39% 58%, #ffd166 59% 100%);
    box-shadow: 0 0 24px rgba(255,209,102,.9);
  }
  .target .ring {
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,.7);
    animation: shrink linear forwards;
  }
  @keyframes pop-in { from { transform: translate(-50%,-50%) scale(0); } }
  @keyframes shrink { to { transform: scale(.55); opacity: .2; } }

  .float {
    position: absolute;
    transform: translate(-50%, -50%);
    font-weight: 800;
    font-size: 20px;
    pointer-events: none;
    animation: float-up .6s ease-out forwards;
  }
  .float.plus  { color: #06d6a0; }
  .float.minus { color: #ef476f; }
  @keyframes float-up {
    to { transform: translate(-50%, -150%); opacity: 0; }
  }

  #field.flash { animation: flash .2s; }
  @keyframes flash { from { background: rgba(239,71,111,.25); } }

  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
    text-align: center;
    background: rgba(18,19,26,.92);
    z-index: 20;
  }
  .overlay h1 { font-size: clamp(28px, 7vw, 48px); }
  .overlay p  { color: #b8b9c6; line-height: 1.7; }
  .overlay .big { font-size: 56px; font-weight: 800; color: #ffd166; }
  .overlay button {
    margin-top: 8px;
    padding: 14px 40px;
    font-size: 20px;
    font-weight: 700;
    color: #12131a;
    background: #06d6a0;
    border: none;
    border-radius: 999px;
    cursor: pointer;
  }
  .overlay button:hover { filter: brightness(1.1); }
  .new-best { color: #06d6a0; font-weight: 700; }
  .back { color: #9a9cab; font-size: 15px; padding: 8px; }
</style>
</head>
<body>

<div id="hud">
  <span>スコア <b id="score">0</b></span>
  <span id="combo"></span>
  <span>残り <b id="time">30.0</b> 秒</span>
</div>

<div id="field"></div>

<div id="start" class="overlay">
  <h1>🎯 反射神経タップ</h1>
  <p>
    的が消える前にクリック（タップ）！<br>
    連続で当てるとコンボでボーナス。<br>
    外すとコンボが切れて -5点。<br>
    ⭐ 金の的は高得点です。
  </p>
  <p>ベスト: <b id="best-start">0</b></p>
  <button id="start-btn">スタート</button>
  <a class="back" href="../">← ゲーム一覧へ</a>
</div>

<div id="result" class="overlay" hidden>
  <h1>タイムアップ！</h1>
  <div class="big" id="final-score">0</div>
  <p id="new-best" class="new-best" hidden>🏆 ベスト更新！</p>
  <p>
    命中 <b id="hits">0</b> ／ ミス <b id="misses">0</b> ／ 最大コンボ <b id="max-combo">0</b><br>
    ベスト: <b id="best-result">0</b>
  </p>
  <button id="retry-btn">もう一回</button>
  <a class="back" href="../">← ゲーム一覧へ</a>
</div>

<script>
(() => {
  const GAME_TIME = 30;            // 制限時間（秒）
  const BEST_KEY  = 'reflexTapBest';

  const $ = id => document.getElementById(id);
  const field = $('field');

  let state;

  // ----- ベストスコア（localStorage が使えなくても動くように） -----
  function loadBest() {
    try { return Number(localStorage.getItem(BEST_KEY)) || 0; } catch { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem(BEST_KEY, String(v)); } catch {}
  }

  // ----- 難易度：経過時間に応じて的を小さく・速く -----
  function difficulty(elapsed) {
    const t = Math.min(elapsed / GAME_TIME, 1);       // 0 → 1
    return {
      size:     Math.round(90 - 50 * t),              // 直径 90px → 40px
      lifetime: 1600 - 900 * t,                       // 表示時間 1.6s → 0.7s
      interval: 750 - 400 * t,                        // 出現間隔 0.75s → 0.35s
      maxAlive: 1 + Math.floor(t * 3),                // 同時出現数 1 → 4
    };
  }

  function startGame() {
    clearTargets();
    state = {
      running: true,
      score: 0,
      combo: 0,
      maxCombo: 0,
      hits: 0,
      misses: 0,
      startAt: performance.now(),
      nextSpawn: 0,
      targets: new Set(),
    };
    $('start').hidden = true;
    $('result').hidden = true;
    updateHud();
    requestAnimationFrame(loop);
  }

  function loop(now) {
    if (!state.running) return;
    const elapsed = (now - state.startAt) / 1000;
    const remain = Math.max(0, GAME_TIME - elapsed);
    $('time').textContent = remain.toFixed(1);

    if (remain <= 0) { endGame(); return; }

    const d = difficulty(elapsed);
    if (now >= state.nextSpawn && state.targets.size < d.maxAlive) {
      spawnTarget(d);
      state.nextSpawn = now + d.interval;
    }
    requestAnimationFrame(loop);
  }

  function spawnTarget(d) {
    const rect = field.getBoundingClientRect();
    const gold = Math.random() < 0.1;
    // 金の的は小さめ。ただし指でも押せるよう 36px は確保する
    const size = gold ? Math.max(36, Math.round(d.size * 0.75)) : d.size;
    const pad = size / 2 + 8;
    const x = pad + Math.random() * (rect.width  - pad * 2);
    const y = pad + Math.random() * (rect.height - pad * 2);

    const el = document.createElement('div');
    el.className = 'target' + (gold ? ' gold' : '');
    el.style.cssText = `left:${x}px;top:${y}px;width:${size}px;height:${size}px`;
    const ring = document.createElement('div');
    ring.className = 'ring';
    ring.style.animationDuration = d.lifetime + 'ms';
    el.appendChild(ring);

    const target = { el, x, y, gold, born: performance.now(), lifetime: d.lifetime };
    target.timer = setTimeout(() => expire(target), d.lifetime);
    el.addEventListener('pointerdown', e => {
      e.stopPropagation();
      hit(target);
    });

    state.targets.add(target);
    field.appendChild(el);
  }

  function hit(t) {
    if (!state.running || !state.targets.has(t)) return;
    removeTarget(t);
    state.hits++;
    state.combo++;
    state.maxCombo = Math.max(state.maxCombo, state.combo);

    // 速く当てるほど高得点（10〜20点）＋ コンボボーナス
    const speed = 1 - (performance.now() - t.born) / t.lifetime;
    let pts = 10 + Math.round(10 * Math.max(0, speed));
    pts += Math.min(state.combo - 1, 10) * 2;
    if (t.gold) pts *= 3;

    state.score += pts;
    floatText(t.x, t.y, '+' + pts, 'plus');
    updateHud();
  }

  function expire(t) {
    if (!state.running || !state.targets.has(t)) return;
    removeTarget(t);
    miss(t.x, t.y);
  }

  function miss(x, y) {
    state.misses++;
    state.combo = 0;
    state.score = Math.max(0, state.score - 5);
    floatText(x, y, '-5', 'minus');
    field.classList.remove('flash');
    void field.offsetWidth;           // アニメーションを再始動
    field.classList.add('flash');
    updateHud();
  }

  // 的以外をクリックしたらミス
  field.addEventListener('pointerdown', e => {
    if (!state || !state.running) return;
    const rect = field.getBoundingClientRect();
    miss(e.clientX - rect.left, e.clientY - rect.top);
  });

  function removeTarget(t) {
    clearTimeout(t.timer);
    t.el.remove();
    state.targets.delete(t);
  }

  function clearTargets() {
    if (state) state.targets.forEach(t => clearTimeout(t.timer));
    field.innerHTML = '';
  }

  function floatText(x, y, text, cls) {
    const el = document.createElement('div');
    el.className = 'float ' + cls;
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    field.appendChild(el);
    setTimeout(() => el.remove(), 600);
  }

  function updateHud() {
    $('score').textContent = state.score;
    $('combo').textContent = state.combo >= 2 ? `${state.combo} コンボ！` : '';
  }

  function endGame() {
    state.running = false;
    clearTargets();
    $('time').textContent = '0.0';

    const best = loadBest();
    const isNew = state.score > best;
    if (isNew) saveBest(state.score);

    $('final-score').textContent = state.score;
    $('hits').textContent = state.hits;
    $('misses').textContent = state.misses;
    $('max-combo').textContent = state.maxCombo;
    $('best-result').textContent = Math.max(best, state.score);
    $('new-best').hidden = !isNew;
    $('result').hidden = false;
  }

  $('best-start').textContent = loadBest();
  $('start-btn').addEventListener('click', startGame);
  $('retry-btn').addEventListener('click', startGame);
})();
</script>
</body>
</html>
