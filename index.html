<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ミニゲーム集</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
    background: #12131a;
    color: #f2f2f5;
    padding: max(32px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { text-align: center; font-size: clamp(28px, 8vw, 40px); margin-bottom: 8px; }
  .sub { text-align: center; color: #9a9cab; margin-bottom: 28px; }
  .games { display: grid; gap: 14px; }
  a.game {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
    border-radius: 16px;
    background: #1d1f2b;
    border: 1px solid #2c2f40;
    color: inherit;
    text-decoration: none;
    transition: transform .12s, border-color .12s;
  }
  a.game:hover, a.game:focus-visible { border-color: #ffd166; transform: translateY(-2px); }
  a.game:active { transform: scale(.98); }
  .icon { font-size: 44px; line-height: 1; }
  .title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .desc { font-size: 14px; color: #9a9cab; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <h1>🎮 ミニゲーム集</h1>
  <p class="sub">スマホでもPCでも遊べます</p>
  <div class="games">
    <a class="game" href="fairy/">
      <span class="icon">🧚</span>
      <span>
        <div class="title">妖精キャッチ</div>
        <div class="desc">山札をめくって妖精を探す2人用カードゲーム。CPU対戦もできます。</div>
      </span>
    </a>
    <a class="game" href="dodge/">
      <span class="icon">🌌</span>
      <span>
        <div class="title">隕石よけサバイバル</div>
        <div class="desc">降ってくる隕石をよけて、どこまで生き残れるか。</div>
      </span>
    </a>
    <a class="game" href="tap/">
      <span class="icon">🎯</span>
      <span>
        <div class="title">反射神経タップ</div>
        <div class="desc">30秒間、出てくる的を素早くタップ！</div>
      </span>
    </a>
  </div>
</main>
</body>
</html>
